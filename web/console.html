<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BreakPhish — Console (live)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0e16;--sidebar1:#121626;--sidebar2:#0e1220;--bg:#0c1019;--surface:#141926;--surface2:#1b2130;
  --line:#272e40;--line2:#1f2534;--txt:#e7ebf4;--muted:#93a0b6;--faint:#64708a;
  --brand:#6366f1;--teal:#22b8b0;
  --ok:#34d399;--ok-bg:rgba(52,211,153,.14);--warn:#fbbf4c;--warn-bg:rgba(251,191,76,.14);--danger:#f4475a;--danger-bg:rgba(244,71,90,.16);
  --info:#38bdf8;--info-bg:rgba(56,189,248,.14);--violet:#a78bfa;--violet-bg:rgba(167,139,250,.16);
  --mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'Hanken Grotesk',system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}html,body{height:100%}
/* dark form controls everywhere */
input,select,textarea{color:var(--txt);background:var(--surface2);border-color:var(--line)}
input::placeholder,textarea::placeholder{color:var(--faint)}
option{background:var(--surface);color:var(--txt)}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
.sidebar{background:linear-gradient(176deg,var(--sidebar1),var(--sidebar2));color:#c7cbe4;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:18px 20px 14px}
.brand .mark{width:32px;height:32px;filter:drop-shadow(0 4px 10px rgba(79,70,229,.5))}
.brand .nm{font-weight:800;font-size:17px;color:#fff}.brand .nm span{color:#8b93f7}
.brand .live{margin-left:auto;font-size:9px;font-weight:700;letter-spacing:.06em;color:#4ade80;border:1px solid #4ade8044;padding:2px 6px;border-radius:5px}
nav.menu{padding:8px 12px;flex:1;overflow:auto}
nav.menu a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:#aeb4d6;font-weight:500;font-size:13.5px;margin-bottom:2px;position:relative}
nav.menu a svg{width:18px;height:18px}
nav.menu a:hover{color:#fff;background:rgba(255,255,255,.06)}
nav.menu a.active{color:#fff;background:rgba(255,255,255,.1)}
nav.menu a.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.side-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#8890b8}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.ctx{font-size:14px;font-weight:600}.banner{font-size:12.5px;padding:5px 12px;background:var(--violet-bg);color:var(--violet);border-radius:8px;font-weight:600}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;font-weight:600;font-size:13px;background:var(--surface);border:1px solid var(--line);color:var(--txt)}
.btn:hover{border-color:var(--muted)}.btn.primary{background:var(--brand);color:#fff;border-color:transparent}.btn.primary:hover{background:#4338ca}
.btn.sm{padding:6px 11px;font-size:12px}.btn.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.btn.teal{background:var(--teal);color:#fff;border-color:transparent}
.view{padding:24px 26px 60px;max-width:1240px;width:100%}
.ph{margin-bottom:20px}.ph h1{font-size:22px}.ph p{color:var(--muted);font-size:13px;margin-top:3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}.card.p{padding:18px}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line2)}.card-h h3{font-size:14.5px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;font-size:11px;color:var(--faint);font-weight:600;padding:11px 16px;border-bottom:1px solid var(--line2);white-space:nowrap}
tbody td{padding:12px 16px;border-bottom:1px solid var(--line2);vertical-align:middle}tbody tr:last-child td{border-bottom:none}
tbody tr.ck{cursor:pointer}tbody tr.ck:hover{background:var(--surface2)}
.co{display:flex;align-items:center;gap:11px}.co .lg{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:7px;white-space:nowrap}
.pill .d{width:6px;height:6px;border-radius:50%}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-danger{background:var(--danger-bg);color:var(--danger)}
.p-info{background:var(--info-bg);color:var(--info)}.p-violet{background:var(--violet-bg);color:var(--violet)}.p-muted{background:var(--line2);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
.stats .s{padding:16px 18px;border-right:1px solid var(--line2)}.stats .s:last-child{border:none}
.stats .l{font-size:12px;color:var(--muted)}.stats .v{font-size:27px;font-weight:800;font-family:var(--mono);margin-top:5px}
.brk{display:flex;flex-direction:column;gap:13px;padding:18px}
.brk .r{display:grid;grid-template-columns:140px 1fr 86px;align-items:center;gap:14px}
.brk .bar{height:10px;background:var(--line2);border-radius:6px;overflow:hidden}.brk .bar>span{display:block;height:100%;border-radius:6px}
.brk .vl{text-align:right;font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.filters{display:flex;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.filters input,.filters select{border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:12.5px;font-family:inherit;background:var(--surface2)}
.pager{display:flex;align-items:center;gap:8px;padding:12px 18px;font-size:12.5px;color:var(--muted)}.pager button{width:30px;height:30px;border:1px solid var(--line);border-radius:8px}.pager button:disabled{opacity:.4}
.scrim{position:fixed;inset:0;background:rgba(20,27,46,.5);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto}.scrim.open{display:flex}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:620px;box-shadow:0 36px 90px -20px rgba(20,27,46,.5);overflow:hidden}
.modal-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line2)}.modal-h h2{font-size:16px;flex:1}
.modal-x{width:30px;height:30px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.modal-b{padding:20px}.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 14px;font-size:13px}.kv .k{color:var(--muted)}
.sig{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}.sig:last-child{border:none}
.sig .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none;font-weight:700}
.sig .w{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
.field{margin-bottom:14px}.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--muted)}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px;font-family:inherit}
.loading{padding:50px;text-align:center;color:var(--faint)}
.setnav{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--muted);margin-bottom:2px;transition:.12s}
.setnav:hover{color:var(--txt);background:var(--surface2)}
.setnav.on{color:#fff;background:var(--brand)}
.pilltabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.pilltabs button{border:1px solid var(--line);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:500;color:var(--muted);background:var(--surface);transition:.12s}
.pilltabs button:hover{color:var(--txt);border-color:var(--muted)}
.pilltabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:11px;font-size:13px;font-weight:500;opacity:0;transition:.22s;z-index:200}.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:900px){#app{grid-template-columns:1fr}.sidebar{display:none}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" fill="none"><path d="M20 3l14 5v9c0 9-6 15.5-14 18.5C12 32.5 6 26 6 17V8l14-5z" fill="url(#g)"/><path d="M14 20l4 4 8-9" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><defs><linearGradient id="g" x1="6" y1="3" x2="34" y2="35"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#4f46e5"/></linearGradient></defs></svg>
      <div class="nm">Break<span>Phish</span></div>
    </div>
    <nav class="menu" id="nav"></nav>
    <div class="side-foot" id="foot">Partner · reading from /api</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="ctx" id="ctx">Customers</div>
      <div class="banner" id="banner" style="display:none"></div>
      <div class="spacer"></div>
      <button class="btn primary" id="newBtn" onclick="openWizard()">+ New customer</button>
      <button class="btn" id="backBtn" style="display:none" onclick="backToPartner()">← Partner view</button>
      <span id="who" style="font-size:12.5px;color:var(--muted);display:none"></span>
      <button class="btn sm" id="logoutBtn" style="display:none" onclick="logout()">Sign out</button>
    </header>
    <main class="view" id="view"><div class="loading"><div class="spin"></div>Loading…</div></main>
  </div>
</div>
<div class="scrim" id="scrim" onclick="if(event.target===this)closeModal()"><div id="modalHost"></div></div>
<div class="toast" id="toast"></div>

<script>
const API='/api';
async function api(path,opts){const r=await fetch(API+path,opts);if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.status);return r.json();}
function el(h){h=h.trim();if(/^<tr\b/i.test(h)){const t=document.createElement('table');t.innerHTML='<tbody>'+h+'</tbody>';return t.querySelector('tr');}if(/^<t[dh]\b/i.test(h)){const t=document.createElement('table');t.innerHTML='<tbody><tr>'+h+'</tr></tbody>';return t.querySelector('td,th');}const d=document.createElement('div');d.innerHTML=h;return d.firstChild;}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);}
function initials(s){return s.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();}
const COLORS=['#4f46e5','#0ea5a3','#c9820a','#7c3aed','#2563eb','#db2777'];

const VERDICT_CLS={clean:'p-ok',spam:'p-warn',spam_likely:'p-warn',phishing:'p-danger',malware:'p-danger',impersonation:'p-danger',policy_infomail:'p-info',policy_geo:'p-info'};
const VERDICT_BAR={clean:'var(--ok)',spam:'var(--warn)',spam_likely:'var(--warn)',phishing:'var(--danger)',malware:'var(--danger)',impersonation:'var(--danger)',policy_infomail:'var(--info)',policy_geo:'var(--info)'};
const DISP_CLS={deliver:'p-ok',junk:'p-warn',quarantine:'p-danger',remediated:'p-violet'};
const DISP_LABEL={deliver:'Deliver',junk:'Junk',quarantine:'Quarantine',remediated:'Remediated'};
const VERDICT_LABEL={clean:'Clean',spam:'Spam',spam_likely:'Spam-Likely',phishing:'Phishing',malware:'Malware',impersonation:'Impersonation',policy_infomail:'Policy — Infomail',policy_geo:'Policy — Geo'};

const STATE={role:'partner',customerId:null,view:'customers',filterText:'',filterVerdict:'',filterFrom:'',filterTo:'',filterDir:'',filterStatus:'',filterRange:'all',dateFrom:'',dateTo:'',page:0,session:null};

/* ---------- auth ---------- */
async function boot(){
  try{ const {session}=await authGet('/auth/me'); applySession(session); }
  catch(e){ renderLogin(); }
}
function applySession(session){
  STATE.session=session;
  if(session.role==='partner_admin'){STATE.role='partner';STATE.customerId=null;STATE._cust=null;}
  else{STATE.role='admin';STATE.customerId=session.customerId;STATE._cust={id:session.customerId,name:session.customerName,domain:session.customerDomain};}
  document.getElementById('who').style.display='inline';
  document.getElementById('who').textContent=session.name;
  document.getElementById('logoutBtn').style.display='inline-flex';
  go(STATE.role==='partner'?'customers':'dashboard');
  applyBranding();
}
async function renderLogin(){
  document.getElementById('newBtn').style.display='none';
  document.getElementById('backBtn').style.display='none';
  document.getElementById('logoutBtn').style.display='none';
  document.getElementById('who').style.display='none';
  document.getElementById('banner').style.display='none';
  document.getElementById('nav').innerHTML='';
  document.getElementById('foot').textContent='Not signed in';
  document.getElementById('ctx').textContent='Sign in';
  const host=document.getElementById('view');
  host.innerHTML='<div class="loading"><div class="spin"></div>Loading sign-in…</div>';
  let data;try{data=await authGet('/auth/personas');}catch(e){host.innerHTML='<div class="card p">Auth unavailable</div>';return;}
  const wrap=el('<div style="max-width:420px;margin:60px auto 0"></div>');
  wrap.appendChild(el(`<div class="card p" style="text-align:center">
    <svg width="48" height="48" viewBox="0 0 40 40" fill="none" style="margin:0 auto 10px"><path d="M20 3l14 5v9c0 9-6 15.5-14 18.5C12 32.5 6 26 6 17V8l14-5z" fill="#4f46e5"/><path d="M14 20l4 4 8-9" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    <h2 style="font-size:19px">Sign in to BreakPhish</h2>
    <p style="color:var(--muted);font-size:13px;margin:6px 0 18px">${data.provider==='entra'?'Use your Microsoft work account':'Choose an account (mock SSO)'}</p>
    <div id="personas"></div></div>`));
  const list=wrap.querySelector('#personas');
  if(data.provider==='entra'){
    const b=el('<button class="btn primary" style="width:100%;justify-content:center">Sign in with Microsoft</button>');
    b.onclick=()=>location.href='/auth/login';list.appendChild(b);
  }else{
    data.personas.forEach(p=>{
      const b=el(`<button class="btn" style="width:100%;justify-content:center;margin-bottom:8px">${p.label}</button>`);
      b.onclick=()=>doLogin(p.id);list.appendChild(b);
    });
    if(!data.personas.length)list.appendChild(el('<div style="color:var(--faint);font-size:13px">No connected tenants yet.</div>'));
  }
  host.innerHTML='';host.appendChild(wrap);
}
async function authGet(path){const r=await fetch(path);if(!r.ok)throw new Error(r.status);return r.json();}
async function doLogin(persona){
  try{const {session}=await authPost('/auth/login/mock',{persona});applySession(session);toast('Signed in as '+session.name);}
  catch(e){toast('Sign-in failed');}
}
async function authPost(path,body){const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body||{})});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.status);return r.json();}
async function logout(){await authPost('/auth/logout');STATE.session=null;renderLogin();}

const ICONS={home:'M4 11l8-7 8 7M6 10v9a1 1 0 001 1h10a1 1 0 001-1v-9',mail:'M3 5h18v14H3zM4 7l8 6 8-6',grid:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',users:'M9 8a3 3 0 100 6 3 3 0 000-6zM3 20c0-3 3-5 6-5s6 2 6 5',shield:'M12 3l7 2.5V11c0 4.5-3 7.8-7 9-4-1.2-7-4.5-7-9V5.5z',lock:'M5 10h14v10H5zM8 10V7a4 4 0 018 0v3',gear:'M12 9a3 3 0 100 6 3 3 0 000-6zM12 3v3M12 18v3M4 12H1M23 12h-3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1',chart:'M4 20V10M10 20V4M16 20v-7M22 20H2',dollar:'M12 2v20M17 6a4 4 0 00-4-2h-1a3 3 0 000 6h2a3 3 0 010 6h-1a4 4 0 01-4-2',list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01'};
function icon(n){return `<svg viewBox="0 0 24 24" fill="none"><path d="${ICONS[n]}" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></svg>`;}
const NAV_PARTNER=[
  ['p-tracker','Live Email Tracker','mail'],
  ['customers','Customers','grid'],
  ['p-team','Team Members','users'],
  ['p-policy','Policy','shield'],
  ['p-analytics','Analytics','chart'],
  ['p-invoices','Invoices','dollar'],
  ['p-audit','Audit Logs','list'],
  ['settings','Settings','gear'],
];
const NAV_ADMIN=[['dashboard','Dashboard','home'],['tracker','Live Email Tracker','mail'],['quarantine','Quarantine','lock'],['users','Users','users'],['policy','Policy','shield'],['settings','Settings','gear']];
function renderNav(){
  const nav=document.getElementById('nav');nav.innerHTML='';
  (STATE.role==='partner'?NAV_PARTNER:NAV_ADMIN).forEach(([id,label,ic])=>{
    const a=el(`<a href="#">${icon(ic)}<span>${label}</span></a>`);
    if(id===STATE.view)a.classList.add('active');
    a.onclick=(e)=>{e.preventDefault();go(id);};nav.appendChild(a);
  });
}
function chrome(){
  document.getElementById('newBtn').style.display=STATE.role==='partner'?'inline-flex':'none';
  document.getElementById('backBtn').style.display=(STATE.session&&STATE.session.impersonating)?'inline-flex':'none';
  const b=document.getElementById('banner');
  if(STATE.role==='admin'&&STATE._cust){b.style.display='block';b.textContent='Logged in as: '+STATE._cust.name;document.getElementById('foot').textContent='Administrator · '+STATE._cust.domain;}
  else{b.style.display='none';document.getElementById('foot').textContent='Partner · reading from /api';}
  renderNav();
}
async function go(view){
  STATE.view=view;STATE.page=0;STATE.filterText='';STATE.filterVerdict='';STATE.filterFrom='';STATE.filterTo='';STATE.filterDir='';STATE.filterStatus='';STATE.filterRange='all';
  document.getElementById('ctx').textContent=({customers:'Customers',dashboard:'Email Security Hub',tracker:'Live Email Tracker',quarantine:'Quarantine',users:'Users',policy:'Policy',settings:'Settings','p-tracker':'Live Email Tracker','p-team':'Team Members','p-policy':'Policy','p-analytics':'Analytics','p-invoices':'Invoices','p-audit':'Audit Logs'})[view]||view;
  chrome();
  const host=document.getElementById('view');host.innerHTML='<div class="loading"><div class="spin"></div>Loading live data…</div>';
  try{const node=await VIEWS[view]();host.innerHTML='';host.appendChild(node);}
  catch(e){host.innerHTML=`<div class="card p" style="color:var(--danger)">Error: ${e.message}</div>`;}
}
async function loginAs(c){
  try{const {session}=await authPost('/auth/impersonate',{customerId:c.id});applySession(session);toast('Now managing '+c.name);}
  catch(e){toast('Cannot impersonate: '+e.message);}
}
async function backToPartner(){
  try{const {session}=await authPost('/auth/stop-impersonating');applySession(session);}
  catch(e){toast(e.message);}
}

const VIEWS={};
function placeholderView(title,desc){
  const v=el('<div></div>');
  v.appendChild(el(`<div class="ph"><h1>${title}</h1><p>${desc}</p></div>`));
  v.appendChild(el(`<div class="card p" style="text-align:center;padding:56px 20px"><div style="font-size:34px;margin-bottom:12px">🚧</div><div style="font-weight:600;font-size:15px">Coming soon</div><div style="color:var(--faint);font-size:13px;margin-top:6px;max-width:420px;margin-left:auto;margin-right:auto">${desc} This section is placed in the navigation and will be built out next.</div></div>`));
  return v;
}
const PLACEHOLDERS={
  'p-tracker':['Live Email Tracker','Aggregate inbound & outbound mail across all your customers.'],
  'p-team':['Team Members','Manage your MSP staff and their console roles.'],
  'p-analytics':['Analytics','Executive summaries, verdict trends, and exportable reports.'],
  'p-invoices':['Invoices','Billing and usage invoices across your customers.'],
  'p-audit':['Audit Logs','Every action taken in the console, with actor, resource, and result.'],
};
Object.entries(PLACEHOLDERS).forEach(([id,[t,d]])=>{VIEWS[id]=async()=>placeholderView(t,d);});

VIEWS.customers=async function(){
  const customers=await api('/customers');
  const v=el('<div></div>');

// Fetch the real analysis (signals come from the actual scorers) and show it.
async function openMessage(id){
  let d;try{d=await api('/customers/'+STATE.customerId+'/messages/'+id);}catch(e){toast('Could not load message');return;}
  const m=d.message,a=d.analysis;
  const kv=(k,v)=>`<div style="display:grid;grid-template-columns:150px 1fr;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line2)"><div style="color:var(--muted);text-align:right">${k}</div><div>${v}</div></div>`;
  const authPill=x=>x==='pass'?'<span class="pill p-ok">Pass</span>':x==='fail'?'<span class="pill p-danger">Fail</span>':'<span class="pill p-warn">None</span>';
  const spamScore=(a.signals||[]).reduce((s,x)=>s+(x.weight||0),0);
  const toneCls={spam:'p-warn',phishing:'p-danger',malware:'p-danger',impersonation:'p-danger',policy_infomail:'p-info',policy_geo:'p-info'};
  const TABS={
    'Email Details':()=>`<div style="border:1px solid var(--line2);border-radius:10px;overflow:hidden">
      ${kv('Header From',`${m.fromDisplay} &lt;${m.fromAddress}&gt;`)}${kv('To',m.to)}${kv('Reply-To',m.replyTo||'—')}${kv('Subject',m.subject)}
      ${kv('Received At',new Date(m.receivedAt).toLocaleString())}${kv('Source',m.source==='internal'?'Internal':'External')}
      ${kv('Attachments',(m.attachments&&m.attachments.length)?m.attachments.map(x=>x.filename).join(', '):'—')}
      ${kv('Direction',m.direction)}${kv('Message ID',`<span class="mono" style="font-size:12px">${m.id}</span>`)}
      ${kv('Service',d.message.service||'BreakPhish 365')}${kv('Status',`<span class="pill ${DISP_CLS[a.disposition]}">${DISP_LABEL[a.disposition]}</span> ${m.to}`)}</div>`,
    'Analysis':()=>`<div style="border:1px solid var(--line2);border-radius:10px;overflow:hidden">
      ${kv('Status',`<span class="pill ${DISP_CLS[a.disposition]}">${DISP_LABEL[a.disposition]}</span>`)}
      ${kv('Verdict',`<span class="pill ${VERDICT_CLS[a.verdict]}">${d.verdictLabel}</span>`)}
      ${kv('SPF',authPill(m.auth.spf))}${kv('DKIM',authPill(m.auth.dkim))}${kv('DMARC',authPill(m.auth.dmarc))}
      ${kv('Spam Score',`<span class="mono">${(spamScore/14).toFixed(2)}</span>`)}
      ${kv('Known Contact',m.firstTimeSender?'No':'Yes')}
      ${kv('Signals',(a.signals||[]).length?(a.signals.map(s=>`<div class="sig" style="padding:6px 0"><div class="ic ${toneCls[s.category]||'p-muted'}">!</div><div class="st"><b>${s.detail}</b><span style="color:var(--muted);font-size:12px">${s.code}</span></div><div class="w">+${s.weight}</div></div>`).join('')):'No risk signals.')}</div>`,
    'Preview':()=>{const held=['quarantine','remediated'].includes(a.disposition);return held&&m.bodyText?`<div style="font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Email body</div><div style="border:1px solid var(--line2);border-radius:10px;padding:14px;font-size:13px;white-space:pre-wrap;color:var(--txt);max-height:46vh;overflow:auto">${(m.bodyText||'').replace(/</g,'&lt;')}</div>`:`<div style="padding:16px;color:var(--warn);font-size:13px">No preview available. Preview is only shown for quarantined mail; clean and delivered mail content is not stored.</div>`;},
    'Event Log':()=>`<div style="border:1px solid var(--line2);border-radius:10px;overflow:hidden"><div style="display:grid;grid-template-columns:200px 1fr;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line2);font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em"><div>Timestamp</div><div>Event</div></div>${(d.events||[]).map(e=>`<div style="display:grid;grid-template-columns:200px 1fr;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line2)"><div class="mono" style="color:var(--muted)">${new Date(e.at).toLocaleString()}</div><div><span style="color:var(--ok)">●</span> ${e.event}</div></div>`).join('')}</div>`,
  };
  let tab='Email Details';
  const held=['quarantine','remediated'].includes(a.disposition);
  const modal=el(`<div class="modal" style="max-width:760px"><div class="modal-h"><h2 style="flex:1">View</h2><button class="modal-x" onclick="closeModal()">✕</button></div>
    <div style="padding:0 20px"><div class="tabs" id="mtabs" style="margin:0"></div></div>
    <div class="modal-b" id="mbody" style="max-height:60vh;overflow:auto"></div>
    <div style="display:flex;gap:10px;align-items:center;padding:14px 20px;border-top:1px solid var(--line)" id="mfoot"><button class="btn" onclick="closeModal()">Close</button><div style="flex:1"></div></div></div>`);
  showModal(modal);
  const tabsEl=modal.querySelector('#mtabs'),bodyEl=modal.querySelector('#mbody'),foot=modal.querySelector('#mfoot');
  const paint=()=>{bodyEl.innerHTML=TABS[tab]();};
  Object.keys(TABS).forEach(t=>{const bt=el(`<button class="${tab===t?'on':''}">${t}</button>`);bt.onclick=()=>{tab=t;tabsEl.querySelectorAll('button').forEach(x=>x.classList.remove('on'));bt.classList.add('on');paint();};tabsEl.appendChild(bt);});
  paint();
  // split-button with a dropdown of options
  function splitBtn(label,cls,items){
    const wrap=el('<div style="position:relative"></div>');
    const b=el(`<button class="btn ${cls} sm">${label} ▾</button>`);
    b.onclick=(e)=>{e.stopPropagation();
      const mn=el('<div></div>');mn.style.cssText='position:fixed;z-index:130;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:6px;box-shadow:0 18px 44px -14px rgba(0,0,0,.5);min-width:300px';
      items.forEach(([lbl,fn])=>{const ib=el(`<button>${lbl}</button>`);ib.style.cssText='display:block;width:100%;text-align:left;padding:9px 11px;border-radius:8px;font-size:13px';ib.onmouseover=()=>ib.style.background='var(--surface2)';ib.onmouseout=()=>ib.style.background='none';ib.onclick=()=>{mn.remove();fn();};mn.appendChild(ib);});
      document.body.appendChild(mn);const r=b.getBoundingClientRect();mn.style.left=Math.max(8,r.right-300)+'px';mn.style.top=(r.top-10-(items.length*40))+'px';
      const close=()=>{mn.remove();document.removeEventListener('click',close);};setTimeout(()=>document.addEventListener('click',close),0);
    };
    wrap.appendChild(b);return wrap;
  }
  const act=async(path,option,msg)=>{try{await api('/customers/'+STATE.customerId+'/messages/'+id+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({option})});closeModal();toast(msg);refresh&&refresh();}catch(e){toast('Failed: '+e.message);}};
  if(held){
    foot.appendChild(splitBtn('Deliver','ok',[['Deliver',()=>confirmAct('Deliver',m,()=>act('/release','plain','Delivered to inbox'))],['Deliver & allow sender for recipient',()=>confirmAct('Deliver',m,()=>act('/release','allow_recipient','Delivered & allowed sender'))],['Deliver & allow sender for organization',()=>confirmAct('Deliver',m,()=>act('/release','allow_org','Delivered & allowed sender (org)'))]]));
    foot.appendChild(splitBtn('Delete','danger',[['Delete',()=>confirmAct('Delete',m,()=>act('/delete','plain','Deleted'))],['Delete & block sender for recipient',()=>confirmAct('Delete',m,()=>act('/delete','block_recipient','Deleted & blocked sender'))],['Delete & block sender for organization',()=>confirmAct('Delete',m,()=>act('/delete','block_org','Deleted & blocked sender (org)'))]]));
    const dl=el('<button class="btn sm">⤓ Download</button>');dl.onclick=()=>{window.open('/api/customers/'+STATE.customerId+'/messages/'+id+'/download','_blank');};foot.appendChild(dl);
  } else {
    foot.appendChild(splitBtn('Remediate','primary',[['Remediate',()=>confirmAct('Remediate',m,()=>act('/remediate','plain','Remediated'))],['Remediate & block sender for recipient',()=>confirmAct('Remediate',m,()=>act('/remediate','block_recipient','Remediated & blocked sender'))],['Remediate & block sender for organization',()=>confirmAct('Remediate',m,()=>act('/remediate','block_org','Remediated & blocked sender (org)'))]]));
  }
}

    tb.innerHTML='';

    const act=row.children[5];
    const vw=el('<button class="btn sm">View</button>');vw.onclick=()=>openMessage(m.id);act.appendChild(vw);

    const rel=el('<button class="btn ok sm" style="margin-left:6px">Deliver</button>');rel.onclick=()=>confirmAct('Deliver',cm,async()=>{try{await api('/customers/'+STATE.customerId+'/messages/'+m.id+'/release',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({option:'plain'})});toast('Delivered to inbox');go('quarantine');}catch(e){toast('Failed: '+e.message);}});act.appendChild(rel);
    const del=el('<button class="btn danger sm" style="margin-left:6px">Delete</button>');del.onclick=()=>confirmAct('Delete',cm,async()=>{try{await api('/customers/'+STATE.customerId+'/messages/'+m.id+'/delete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({option:'plain'})});toast('Deleted');go('quarantine');}catch(e){toast('Failed: '+e.message);}});act.appendChild(del);
    tb.appendChild(row);

  }
  let qdeb;filt.querySelector('#qsearch').oninput=e=>{clearTimeout(qdeb);qdeb=setTimeout(()=>drawQ(e.target.value.trim().toLowerCase()),200);};
  drawQ('');
  card.appendChild(tbl);v.appendChild(card);
  return v;
};

/* ---- Policy (templates + rules) ---- */
const POL_TABS=['Policy Templates','Global Custom Rules','Global Outbound DLP Rules','Global Allow Rules','Global Block Rules','Auto Remediation','Link Rewrite Protection'];

// checkbox group → selected array

function pairSelect(val,pairs,on){const s=el('<select style="width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;font-family:inherit"></select>');pairs.forEach(([v2,lbl])=>{const o=document.createElement('option');o.value=v2;o.textContent=lbl;if(v2===val)o.selected=true;s.appendChild(o);});s.onchange=()=>on(s.value);return s;}

async function polRules(kind,title){
  const {rules}=await api('/policy/rules?kind='+kind);
  const v=el('<div></div>');
  const soft=['dlp','auto_remediation','link_rewrite'].includes(kind);
  if(soft)v.appendChild(el(`<div class="card p" style="margin-bottom:12px;font-size:12.5px;color:var(--muted)"><b style="color:var(--txt)">Note:</b> ${title} rules are stored and managed here; active enforcement is a follow-up.</div>`));
  const head=el('<div style="display:flex;margin-bottom:12px"><div style="flex:1"></div></div>');
  const nb=el('<button class="btn primary sm">+ New rule</button>');nb.onclick=()=>openRuleEditor(kind,title,null);head.appendChild(nb);v.appendChild(head);
  const card=el('<div class="card pad0" style="overflow:hidden"></div>');
  const tbl=el('<table><thead><tr><th>Status</th><th>Comment</th><th>Senders / match</th><th>Action</th><th>Scope</th><th>Applies to</th><th>Created</th><th style="text-align:right"></th></tr></thead><tbody></tbody></table>');
  const tb=tbl.querySelector('tbody');
  if(!rules.length)tb.appendChild(el('<tr><td colspan="8" style="padding:30px;text-align:center;color:var(--faint)">No results.</td></tr>'));
  rules.forEach(r=>{
    const actLbl=kind==='allow'?'Allow (Deliver)':kind==='block'?'Block (Quarantine)':(r.data.action||'—');
    // On the customer side, a global rule's effective status reflects their own opt-out.
    const effectiveOn=r.global&&!r.editable?!r.disabledForMe:r.enabled;
    const statusPill=effectiveOn?'<span class="pill p-ok"><span class="d" style="background:var(--ok)"></span>Active</span>':'<span class="pill p-muted">Disabled</span>';
    const scopePill=r.global?'<span class="pill p-info">Global</span>':'<span class="pill p-muted">Customer</span>';
    const row=el(`<tr><td>${statusPill}</td><td>${r.data.comment||'—'}</td><td style="color:var(--muted);max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ruleMatch(r)}</td><td><span class="pill p-muted">${actLbl}</span></td><td>${scopePill}</td><td style="color:var(--muted);font-size:12px">${r.appliesTo||'—'}</td><td class="mono" style="color:var(--muted)">${new Date(r.createdAt).toLocaleDateString()}</td><td style="text-align:right;white-space:nowrap"></td></tr>`);
    const act=row.children[7];
    if(r.editable){
      const tg=el(`<button class="btn sm">${r.enabled?'Disable':'Enable'}</button>`);tg.onclick=async()=>{try{await api('/policy/rules/'+r.id,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({kind:r.kind,enabled:!r.enabled,data:{...r.data,active:!r.enabled}})});toast(r.enabled?'Rule disabled':'Rule enabled');go(STATE.role==='partner'?'p-policy':'policy');}catch(e){toast('Failed: '+e.message);}};act.appendChild(tg);
      const ed=el('<button class="btn sm" style="margin-left:6px">Edit</button>');ed.onclick=()=>openRuleEditor(kind,title,r);act.appendChild(ed);
      const del=el('<button class="btn sm" style="margin-left:6px;color:var(--danger)">✕</button>');del.onclick=async()=>{if(!confirm('Delete rule?'))return;await api('/policy/rules/'+r.id,{method:'DELETE'});go(STATE.role==='partner'?'p-policy':'policy');};act.appendChild(del);
    } else if(r.global&&STATE.role!=='partner'){
      // customer can opt out of (or back into) a global rule for themselves
      const tg=el(`<button class="btn sm">${r.disabledForMe?'Enable for us':'Disable for us'}</button>`);
      tg.onclick=async()=>{try{await api('/policy/rules/'+r.id+'/override',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({disabled:!r.disabledForMe})});toast(r.disabledForMe?'Enabled for your org':'Disabled for your org');go('policy');}catch(e){toast('Failed: '+e.message);}};

// Mesh-style multi-select dropdown. Mutates `selected` (array of ids) in place.
function multiSelect(placeholder,options,selected){
  const wrap=el('<div style="position:relative"></div>');
  const btn=el('<button type="button" style="width:100%;text-align:left;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px;background:var(--surface2);color:var(--txt);display:flex;align-items:center;gap:8px"></button>');
  const label=el('<span style="flex:1"></span>');btn.appendChild(label);btn.appendChild(el('<span style="color:var(--faint)">▾</span>'));
  const panel=el('<div style="position:absolute;z-index:60;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;max-height:230px;overflow:auto;box-shadow:0 18px 44px -14px rgba(0,0,0,.55);display:none"></div>');
  const refresh=()=>{label.textContent=selected.length?selected.length+' selected':placeholder;label.style.color=selected.length?'var(--txt)':'var(--faint)';};
  if(!options.length)panel.appendChild(el('<div style="color:var(--faint);font-size:12px;padding:8px 10px">No customers.</div>'));
  options.forEach(o=>{const row=el('<label style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px"></label>');const cb=el('<input type="checkbox">');cb.checked=selected.includes(o.id);cb.onchange=()=>{if(cb.checked){if(!selected.includes(o.id))selected.push(o.id);}else{const i=selected.indexOf(o.id);if(i>=0)selected.splice(i,1);}refresh();};row.onmouseover=()=>row.style.background='var(--surface2)';row.onmouseout=()=>row.style.background='none';row.appendChild(cb);row.appendChild(el('<span>'+o.name+'</span>'));panel.appendChild(row);});
  btn.onclick=(e)=>{e.stopPropagation();panel.style.display=panel.style.display==='none'?'block':'none';};
  panel.onclick=e=>e.stopPropagation();
  document.addEventListener('click',()=>{panel.style.display='none';});
  refresh();wrap.appendChild(btn);wrap.appendChild(panel);return wrap;
}
// Summarize what a rule matches on, for the list.
function ruleMatch(r){const d=r.data||{};const p=[];if(d.sender)p.push(d.sender);if(d.senders&&d.senders.length)p.push(...d.senders);if(d.ip&&d.ip.length)p.push(...d.ip.map(x=>'IP:'+x));if(d.subjects&&d.subjects.length)p.push(...d.subjects.map(x=>'Subj:'+x));if(d.urls&&d.urls.length)p.push(...d.urls.map(x=>'URL:'+x));if(d.name)p.push(d.name);return p.join(', ')||'—';}
// multi-line text field returning array (with optional initial array)

function toggleField(label,desc,on,set){const r=el(`<div style="display:flex;align-items:center;gap:14px;padding:10px 0"><div style="flex:1"><div style="font-weight:600;font-size:13.5px">${label}</div>${desc?`<div style="font-size:11.5px;color:var(--faint)">${desc}</div>`:''}</div></div>`);const t=makeToggle(on);t.onclick=(()=>{const o=t.onclick;return()=>{o&&o();set(t._get());};})();r.appendChild(t);return r;}

    verified.forEach(d=>tb.appendChild(el(`<tr><td style="font-weight:600">${d}</td><td><span class="pill p-muted">Verified (M365)</span></td><td><span class="pill p-ok"><span class="d" style="background:var(--ok)"></span>Active</span></td><td></td></tr>`)));
    SET.managedDomains.forEach((d,i)=>{const row=el(`<tr><td style="font-weight:600">${d}</td><td><span class="pill p-info">Custom</span></td><td><span class="pill p-ok"><span class="d" style="background:var(--ok)"></span>Active</span></td><td style="text-align:right"></td></tr>`);const del=el('<button class="btn sm" style="color:var(--danger)">✕</button>');del.onclick=()=>{SET.managedDomains.splice(i,1);draw();};row.children[3].appendChild(del);tb.appendChild(row);});
    if(!verified.length&&!SET.managedDomains.length)tb.appendChild(el('<tr><td colspan="4" style="padding:24px;text-align:center;color:var(--faint)">No domains yet.</td></tr>'));
  }
  draw();
  const card2=el('<div class="card pad0" style="overflow:hidden;margin-bottom:14px"></div>');card2.appendChild(tbl);
  const add=el('<div style="display:flex;gap:8px;max-width:460px"></div>');
  const inp=el('<input placeholder="add a domain, e.g. example.com" style="flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px">');
  const addBtn=el('<button class="btn sm">+ Add domain</button>');
  addBtn.onclick=()=>{const v=inp.value.trim().toLowerCase().replace(/^@/,'');if(!v)return;if(!verified.includes(v)&&!SET.managedDomains.includes(v))SET.managedDomains.push(v);inp.value='';draw();};
  inp.onkeydown=e=>{if(e.key==='Enter')addBtn.onclick();};
  add.appendChild(inp);add.appendChild(addBtn);
  const wrap=el('<div></div>');wrap.appendChild(card2);wrap.appendChild(add);wrap.appendChild(sSaveBar());
  return wrap;
}
async function settingsBanners(){
  const c=el('<div class="card p"></div>');
  c.appendChild(el('<div style="font-size:11.5px;color:var(--faint);margin-bottom:14px">Warning banners shown on delivered mail. Use <span class="mono">{{sender}}</span> and <span class="mono">{{source}}</span> as placeholders. <b style="color:var(--txt)">Stored now; injection into delivered mail is the next step.</b></div>'));
  function group(title, obj){
    c.appendChild(el(`<div style="font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 6px">${title}</div>`));
    const head=el('<div style="display:grid;grid-template-columns:150px 46px 1fr;gap:10px;font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;padding:0 0 6px"><div>Name</div><div>Color</div><div>Message</div></div>');
    c.appendChild(head);
    Object.keys(obj).forEach(name=>{
      const bn=obj[name];
      const rowEl=el('<div style="display:grid;grid-template-columns:150px 46px 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line2)"></div>');
      rowEl.appendChild(el(`<div style="font-size:13px;font-weight:600;padding-top:8px">${name}</div>`));
      const col=el('<input type="color">');col.value=bn.color;col.style.cssText='width:40px;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;cursor:pointer';col.oninput=()=>bn.color=col.value;rowEl.appendChild(col);
      const ta=el('<textarea style="width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12.5px;font-family:inherit;min-height:52px;resize:vertical"></textarea>');ta.value=bn.message;ta.oninput=()=>bn.message=ta.value;rowEl.appendChild(ta);
      c.appendChild(rowEl);
    });
  }
  group('Verdict banners', SET.banners.verdict);
  c.appendChild(el('<div style="height:18px"></div>'));
  group('Contextual banners', SET.banners.contextual);
  c.appendChild(sSaveBar());return c;
}

/* ---- customer row actions ---- */
async function connectCustomer(c,btn){
  btn.textContent='…';btn.disabled=true;
  try{const r=await api('/customers/'+c.id+'/connect',{method:'POST'});
    if(r.redirect){toast('Opening Microsoft consent…');window.location.href=r.redirect;return;}
    toast('Connected & synced '+c.name);go('customers');}
  catch(err){toast('Connect failed: '+err.message);btn.textContent='Connect';btn.disabled=false;}
}
function closeRowMenu(){if(window._rm){window._rm.remove();window._rm=null;}}
document.addEventListener('click',closeRowMenu);
function openRowMenu(btn,c){
  closeRowMenu();
  const connected=c.connection.status==='connected';
  const items=[
    {label:'✎  Edit', onClick:()=>openEditCustomer(c)},
    connected?{label:'↻  Azure Sync', onClick:()=>resyncCustomer(c)}:null,
    connected?{label:'⟳  O365 Reauthorize', onClick:()=>reauth(c)}:null,
    {label:'⇄  Switch Service', onClick:()=>toast('Switching service (Gateway/Unified) — coming soon')},
    {label:'✕  Delete customer', danger:true, onClick:()=>deleteCust(c)},
  ].filter(Boolean);
  const m=el('<div></div>');
  m.style.cssText='position:fixed;z-index:120;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:6px;box-shadow:0 18px 44px -14px rgba(20,27,46,.28);min-width:200px';
  items.forEach(it=>{const b=el(`<button>${it.label}</button>`);b.style.cssText='display:block;width:100%;text-align:left;padding:9px 11px;border-radius:8px;font-size:13px;font-weight:500;'+(it.danger?'color:var(--danger)':'');b.onmouseover=()=>b.style.background='var(--surface2)';b.onmouseout=()=>b.style.background='none';b.onclick=(e)=>{e.stopPropagation();closeRowMenu();it.onClick();};m.appendChild(b);});
  document.body.appendChild(m);
  const r=btn.getBoundingClientRect();
  m.style.top=(r.bottom+4)+'px';m.style.left=Math.max(8,r.right-200)+'px';
  window._rm=m;
}
async function resyncCustomer(c){try{const r=await api('/customers/'+c.id+'/resync',{method:'POST'});toast(`Synced ${r.users} users, scored ${r.scored} new`);go('customers');}catch(e){toast('Re-sync failed: '+e.message);}}
async function reauth(c){try{const r=await api('/customers/'+c.id+'/connect',{method:'POST'});if(r.redirect){toast('Opening Microsoft consent…');window.location.href=r.redirect;return;}toast('Reauthorized '+c.name);go('customers');}catch(e){toast('Reauthorize failed: '+e.message);}}
async function deleteCust(c){if(!confirm(`Delete ${c.name}? This removes its users, mail, and all data. This cannot be undone.`))return;try{await api('/customers/'+c.id,{method:'DELETE'});toast('Deleted '+c.name);go('customers');}catch(e){toast('Delete failed: '+e.message);}}

function makeToggle(on){
  const w=el('<div style="width:40px;height:22px;border-radius:12px;position:relative;cursor:pointer;flex:none"></div>');
  const k=el('<div style="position:absolute;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.15s"></div>');
  w.appendChild(k);let s=on;const paint=()=>{w.style.background=s?'var(--brand)':'#cfd4e6';k.style.left=s?'20px':'2px';};paint();
  w.onclick=()=>{s=!s;paint();};w._get=()=>s;return w;
}
const FLAG_META=[
  ['partnerAccess','Partner Access','Allows partner access to the customer account for management'],
  ['customerBanners','Customer Banners','Allows the customer to use its own warning banners'],
  ['analyticsReports','Analytics Reports','Allows the customer to generate analytics reports'],
  ['require2fa','Require 2FA','Require two-factor authentication for this customer'],
  ['forceAzureLogin','Force Azure Login','Force Azure SSO (already enforced — sign-in is SSO-only)'],
];
function openEditCustomer(c){
  const modal=el(`<div class="modal"><div class="modal-h"><h2>Edit ${c.name}</h2><button class="modal-x" onclick="closeModal()">✕</button></div><div class="modal-b" id="eb"></div></div>`);
  showModal(modal);const b=modal.querySelector('#eb');
  b.appendChild(el(`<div style="font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">General information</div>`));
  b.appendChild(el(`<div class="field"><label>Customer ID</label><input value="${c.id}" disabled style="background:var(--surface2);color:var(--muted)"></div>`));
  b.appendChild(el(`<div class="field"><label>Customer name</label><input id="ename" value="${c.name}"></div>`));
  b.appendChild(el(`<div class="field"><label>Service</label><input value="${c.service||'—'}" disabled style="background:var(--surface2);color:var(--muted)"></div>`));
  b.appendChild(el(`<div class="field"><label>Mail platform</label><input value="Office 365" disabled style="background:var(--surface2);color:var(--muted)"></div>`));
  b.appendChild(el(`<div class="field"><label>Licenses</label><input id="elic" value="${c.licenses||0}" inputmode="numeric"></div>`));
  b.appendChild(el(`<div class="field"><label>Domain</label><input value="${c.domain}" disabled style="background:var(--surface2);color:var(--muted)"></div>`));
  b.appendChild(el(`<div style="font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 6px">Additional</div>`));
  const toggles={};
  FLAG_META.forEach(([key,label,desc])=>{
    const rowEl=el(`<div style="display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line2)"><div style="flex:1"><div style="font-size:13.5px;font-weight:600">${label}</div><div style="font-size:11.5px;color:var(--faint)">${desc}</div></div></div>`);
    const t=makeToggle(Boolean(c.flags?.[key]));toggles[key]=t;rowEl.appendChild(t);b.appendChild(rowEl);
  });
  const foot=el(`<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="esave">Submit</button></div>`);
  foot.querySelector('#esave').onclick=async()=>{
    const flags={};FLAG_META.forEach(([k])=>flags[k]=toggles[k]._get());
    try{await api('/customers/'+c.id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({name:b.querySelector('#ename').value,licenses:Number(b.querySelector('#elic').value)||0,flags})});
      closeModal();toast('Customer updated');go('customers');}
    catch(e){toast('Update failed: '+e.message);}
  };
  b.appendChild(foot);
}

/* ---- wizard (create via API) ---- */
const WIZ={step:0,name:'',domain:'',mailboxes:'',products:['email_security']};
function openWizard(){Object.assign(WIZ,{step:0,name:'',domain:'',mailboxes:'',products:['email_security']});renderWizard();}
function renderWizard(){
  const modal=el(`<div class="modal"><div class="modal-h"><h2>New customer</h2><button class="modal-x" onclick="closeModal()">✕</button></div><div class="modal-b" id="wb"></div></div>`);
  showModal(modal);const b=modal.querySelector('#wb');
  b.appendChild(el(`<div class="field"><label>Company name</label><input id="wn" value="${WIZ.name}" placeholder="Acme Corporation"></div>`));
  b.appendChild(el(`<div class="field"><label>Primary domain</label><input id="wd" value="${WIZ.domain}" placeholder="acme.test"></div>`));
  b.appendChild(el(`<div class="field"><label>Mailboxes</label><input id="wm" value="${WIZ.mailboxes}" placeholder="120"></div>`));
  b.appendChild(el(`<div class="field"><label>Service</label><select><option>BreakPhish 365 (API)</option><option disabled>BreakPhish Gateway — coming soon</option><option disabled>BreakPhish Unified — coming soon</option></select></div>`));
  const foot=el(`<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="wc">Create customer</button></div>`);
  foot.querySelector('#wc').onclick=async()=>{
    const name=b.querySelector('#wn').value,domain=b.querySelector('#wd').value,mailboxes=b.querySelector('#wm').value;
    if(!name||!domain){toast('Enter name and domain');return;}
    try{await api('/customers',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,domain,products:['email_security'],integrationModel:'api',mailboxes})});
      closeModal();toast('Customer created — awaiting consent');go('customers');}
    catch(e){toast(e.message);}
  };
  b.appendChild(foot);
}
function showModal(n){const h=document.getElementById('modalHost');h.innerHTML='';h.appendChild(n);document.getElementById('scrim').classList.add('open');}
function closeModal(){document.getElementById('scrim').classList.remove('open');}

// Lightweight confirm dialog (overlays whatever modal is open).
function confirmBox(opts){
  const scrim=el('<div></div>');scrim.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150;display:grid;place-items:start center;padding-top:14vh';
  const box=el(`<div style="background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;max-width:460px;box-shadow:0 30px 80px -20px rgba(0,0,0,.65);animation:pop .15s ease">
    <div style="display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line2)"><h3 style="flex:1;font-size:15px">${opts.title}</h3><button class="modal-x" id="cx">✕</button></div>
    <div style="padding:16px 18px;font-size:13.5px;color:var(--txt)">${opts.body}</div>
    <div style="display:flex;gap:10px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line2)"><button class="btn" id="cc">Cancel</button><button class="btn ${opts.confirmCls||'primary'}" id="ck">${opts.confirmLabel||'Confirm'}</button></div></div>`);
  scrim.appendChild(box);document.body.appendChild(scrim);
  const close=()=>scrim.remove();
  box.querySelector('#cx').onclick=close;box.querySelector('#cc').onclick=close;
  box.querySelector('#ck').onclick=()=>{close();opts.onConfirm();};
  scrim.onclick=(e)=>{if(e.target===scrim)close();};
}
function confirmAct(verb,m,run){
  const past={Deliver:'delivered to the inbox',Delete:'deleted',Remediate:'remediated and moved to quarantine'}[verb]||'processed';
  confirmBox({title:`${verb} 1 email?`,
    body:`This email will be ${past}.<ul style="margin:10px 0 0;padding-left:18px;color:var(--muted)"><li>from <b style="color:var(--txt)">${m.fromAddress}</b> to <b style="color:var(--txt)">${m.to}</b></li></ul>`,
    confirmLabel:verb, confirmCls:verb==='Delete'?'danger':verb==='Deliver'?'ok':'primary', onConfirm:run});
}

/* init */
boot();
</script>
